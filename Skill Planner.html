<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skill Planner</title>
<style>
:root{--bg:#f3f1fa;--surface:#fff;--text:#241f3a;--muted:#6f6a8a;--accent:#6c4de6;--done:#2f9e6b;--line:#dcd8ee;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17142a;--surface:#221e3b;--text:#efecfb;--muted:#9a95b8;--accent:#9d86ff;--done:#4fd09a;--line:#38325a}}
:root[data-theme="dark"]{--bg:#17142a;--surface:#221e3b;--text:#efecfb;--muted:#9a95b8;--accent:#9d86ff;--done:#4fd09a;--line:#38325a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;display:flex;justify-content:center;padding:20px 14px}
main{width:100%;max-width:460px}
.cols{display:flex;flex-direction:column}
.col{display:contents}
@media (min-width:860px){main{max-width:940px}.cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}.col{display:block}}
h1{font-size:1.3rem;margin:0 0 4px}
h2{font-size:1rem;margin:22px 0 8px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 8px}
.group{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px 14px}
.row{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.name{flex:1;text-transform:capitalize}
.count{min-width:48px;text-align:center;font-variant-numeric:tabular-nums;font-weight:700}
.row.done .count,.ok{color:var(--done)}
button,select{font-family:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;font-size:1rem}
button{cursor:pointer}
.sq{width:40px;height:40px;font-size:1.4rem;line-height:1}
button:active{background:var(--accent);color:#fff;border-color:var(--accent)}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
select{width:100%;height:40px;padding:0 8px;text-transform:capitalize}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px}
.form .full{grid-column:1/-1}
.primary{height:44px;background:var(--accent);color:#fff;border-color:var(--accent);font-weight:700}
.slot{padding:5px 0;border-bottom:1px solid var(--line)}
.slot summary{cursor:pointer;font-weight:700;text-transform:capitalize;padding:2px 0}
.slot:last-child{border-bottom:0}
.slot b{text-transform:capitalize}
.eq{display:flex;align-items:center;gap:8px;padding:1px 0 1px 14px;font-size:.9rem;text-transform:capitalize}
.eq span{flex:1}
.x{width:24px;height:24px;font-size:.8rem;border-radius:6px;padding:0}
.empty{color:var(--muted);font-size:.9rem;padding:2px 0 2px 10px}
.best{padding:12px 14px}
.big{font-size:1.2rem;font-weight:700;margin-bottom:6px}
.pick{text-transform:capitalize;padding:3px 0;font-size:.95rem}
.pick i{color:var(--muted);font-style:normal}
.reset{width:100%;height:44px;margin-top:18px}
.pool{font-size:.85rem;color:var(--muted);padding:8px 0 2px;font-weight:700}
.pool.ok{color:var(--done)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));column-gap:14px;padding-bottom:6px}
.wr{display:flex;align-items:center;gap:6px;padding:3px 0;font-size:.9rem}
.wr .name{flex:1;min-width:0}
.wr:not(.on) .name{color:var(--muted)}
.wr .count{min-width:20px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.mini{width:28px;height:28px;font-size:1.1rem;line-height:1;border-radius:8px}
</style>
</head>
<body>
<main>
  <h1>Skill planner</h1>
  <p class="sub">Each equip line gives +1 to a skill. One equip per slot, 6 slots. Spread up to 18 wanted points across skills (max 3 each) and it finds the closest combo.</p>

  <div class="cols"><div class="col">
  <div style="order:1"><h2>Wanted levels</h2>
  <div class="group" id="base"></div></div>
  <div style="order:4"><h2>Best combination</h2>
  <div class="group best" id="best"></div></div>
  </div><div class="col">
  <div style="order:2">

  <h2>Add equip</h2>
  <div class="group form">
    <select id="slot" aria-label="Slot"></select>
    <select id="l0" aria-label="Line 1"></select>
    <select id="l1" aria-label="Line 2"></select>
    <select id="l2" aria-label="Line 3"></select>
    <button class="primary full" id="add">Add equip</button>
  </div>

  </div><div style="order:3"><h2>My equips</h2>
  <div class="group" id="list" style="padding-top:8px;padding-bottom:8px"></div>

  </div></div></div>

  <button class="reset" id="reset">Reset everything</button>
</main>
<script>
const skills=[["Dimensional Leap",3],["White Hole",3],["Registry",3],["Attack",3],["Crit Damage",1],["Warrior",1],["Mage",1],["Archer",1],["Thief",1],["Pirate",1],["Damage",0],["Boss Damage",0],["Ignore Defense",0]];
const slots=["hat","top","bottom","gloves","boots","cape"];
const KEY="skill-planner-v2";
let vals=skills.map(([n,m])=>m), equips=[];
try{
  const s=JSON.parse(localStorage.getItem(KEY)||"null");
  if(s&&Array.isArray(s.vals)){
    skills.forEach(([n,m],i)=>{const v=Number(s.vals[i]);if(Number.isInteger(v))vals[i]=Math.min(3,Math.max(0,v))});
    if(Array.isArray(s.equips)) equips=s.equips.filter(e=>slots.includes(e.slot)&&Array.isArray(e.lines));
  }
}catch(e){}
try{
  if(!equips.length){
    const o=JSON.parse(localStorage.getItem("skill-planner-v1")||"null");
    if(o&&Array.isArray(o.equips)&&o.equips.length){
      equips=o.equips.filter(e=>slots.includes(e.slot)&&Array.isArray(e.lines));
      localStorage.removeItem("skill-planner-v1");
    }
  }
}catch(e){}
const $=id=>document.getElementById(id);
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify({vals,equips}))}catch(e){}};

// wanted levels
const CAP=3,POOL=18;
const used=()=>vals.reduce((x,v)=>x+v,0);
const pool=document.createElement("div");pool.className="pool";
const wgrid=document.createElement("div");wgrid.className="wgrid";
$("base").append(pool,wgrid);
const baseRows=skills.map(([n],i)=>{
  const r=document.createElement("div");r.className="wr";
  r.innerHTML='<span class="name"></span><button class="mini" aria-label="Decrease">\u2212</button><span class="count"></span><button class="mini" aria-label="Increase">+</button>';
  r.querySelector(".name").textContent=n;
  const [m,p]=r.querySelectorAll("button");
  m.onclick=()=>{vals[i]=Math.max(0,vals[i]-1);render()};
  p.onclick=()=>{if(used()<POOL)vals[i]=Math.min(CAP,vals[i]+1);render()};
  wgrid.appendChild(r);
  return{r,m,p,c:r.querySelector(".count")};
});

// selects
slots.forEach(s=>$("slot").add(new Option(s,s)));
["l0","l1","l2"].forEach((id,k)=>{
  $(id).add(new Option("\u2014 line "+(k+1)+" \u2014",""));
  skills.forEach(([n],i)=>$(id).add(new Option(n,i)));
});
$("add").onclick=()=>{
  const lines=["l0","l1","l2"].map(id=>$(id).value).filter(v=>v!=="").map(Number);
  if(!lines.length){$("l0").focus();return}
  equips.push({id:Date.now()+Math.random(),slot:$("slot").value,lines});
  ["l0","l1","l2"].forEach(id=>$(id).value="");
  render();
};
$("reset").onclick=()=>{if(confirm("Clear wanted levels and all equips?")){vals=skills.map(([n,m])=>m);equips=[];render()}};

function optimize(){
  const opts=slots.map(s=>{
    const seen=new Map();
    equips.filter(e=>e.slot===s).forEach(e=>{
      const k=e.lines.slice().sort().join();
      if(!seen.has(k))seen.set(k,e);
    });
    return[...seen.values()];
  });
  const active=opts.map((o,i)=>o.length?i:-1).filter(i=>i>=0);
  let best={score:-1,pick:[]},cur=[];
  const cnt=skills.map(()=>0);
  const capLeft=()=>skills.reduce((a,[n,m],i)=>a+Math.max(0,vals[i]-cnt[i]),0);
  const score=()=>skills.reduce((a,[n,m],i)=>a+Math.min(vals[i],cnt[i]),0);
  function dfs(k){
    const s=score();
    if(k===active.length){if(s>best.score)best={score:s,pick:cur.slice()};return}
    const bound=s+Math.min(3*(active.length-k),capLeft());
    if(bound<=best.score)return;
    const o=opts[active[k]];
    const gain=e=>{const t=cnt.slice();e.lines.forEach(l=>t[l]++);return skills.reduce((a,[n,m],i)=>a+Math.min(vals[i],t[i]),0)};
    o.map(e=>[gain(e),e]).sort((a,b)=>b[0]-a[0]).forEach(([g,e])=>{
      e.lines.forEach(l=>cnt[l]++);cur.push(e);
      dfs(k+1);
      cur.pop();e.lines.forEach(l=>cnt[l]--);
    });
  }
  dfs(0);
  return best;
}

const closed=new Set();
function render(){
  save();
  let t=0,m=0;
  baseRows.forEach((o,i)=>{
    o.c.textContent=vals[i];o.r.classList.toggle("on",vals[i]>0);
    o.m.disabled=vals[i]===0;o.p.disabled=vals[i]>=CAP||used()>=POOL;});
  pool.textContent="Points: "+used()+" / "+POOL;
  pool.classList.toggle("ok",used()===POOL);
  // list
  const L=$("list");L.innerHTML="";
  if(!equips.length){L.innerHTML='<div class="empty">No equips yet. Add one above.</div>'}
  slots.forEach(s=>{
    const es=equips.filter(e=>e.slot===s);
    const d=document.createElement("details");d.className="slot";d.open=!closed.has(s);
    d.ontoggle=()=>{d.open?closed.delete(s):closed.add(s)};
    const h=document.createElement("summary");h.textContent=s+" ("+es.length+")";d.appendChild(h);
    es.forEach(e=>{
      const r=document.createElement("div");r.className="eq";
      const sp=document.createElement("span");sp.textContent=e.lines.map(l=>skills[l][0]).join(" / ");
      const x=document.createElement("button");x.className="x";x.textContent="\u2715";x.setAttribute("aria-label","Remove equip");
      x.onclick=()=>{equips=equips.filter(q=>q.id!==e.id);render()};
      r.append(sp,x);d.appendChild(r);
    });
    if(equips.length)L.appendChild(d);
  });
  // best
  const B=$("best");B.innerHTML="";
  if(!equips.length){B.innerHTML='<div class="empty" style="padding:0">Add equips to see the best set.</div>';return}
  const b=optimize();
  const tot=skills.map(()=>0);
  b.pick.forEach(e=>e.lines.forEach(l=>tot[l]++));
  const max=vals.reduce((a,x)=>a+x,0);
  const big=document.createElement("div");big.className="big";
  big.textContent=b.score+" / "+max+" wanted points";B.appendChild(big);
  slots.forEach(s=>{
    const e=b.pick.find(p=>p.slot===s);
    const d=document.createElement("div");d.className="pick";
    d.innerHTML="<b></b> <i></i>";
    d.querySelector("b").textContent=s+": ";
    d.querySelector("i").textContent=e?e.lines.map(l=>skills[l][0]).join(" / "):"nothing";
    B.appendChild(d);
  });
  const hr=document.createElement("div");hr.style.cssText="border-top:1px solid var(--line);margin:10px 0 6px";B.appendChild(hr);
  skills.forEach(([n,mx],i)=>{
    const w=vals[i];if(!w&&!tot[i])return;
    const d=document.createElement("div");d.className="pick";
    d.innerHTML="<span></span>";
    d.firstChild.textContent=n+" "+Math.min(w,tot[i])+"/"+w+(tot[i]>w?" (+"+(tot[i]-w)+" wasted)":"");
    if(w&&tot[i]>=w)d.firstChild.className="ok";
    B.appendChild(d);
  });
}
render();
</script>
</body>
</html>
